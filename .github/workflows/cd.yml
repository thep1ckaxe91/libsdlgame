name: CD Conan Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-cache-conan:
    name: Package Conan on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Conan
      run: |
        python -m pip install --upgrade pip
        pip install conan

    - name: Setup Conan Profile
      run: conan profile detect --force

    - name: Linux specific setup (OpenGL & ALSA)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-dev libasound2-dev libpulse-dev

    - name: Create Conan Package
      run: |
        conan create . --build=missing -s build_type=Release -c tools.system.package_manager:mode=install -c tools.system.package_manager:sudo=True

    - name: Save Conan Cache Archive
      run: |
        conan cache save "libsdlgame/0.1.0" --file libsdlgame-${{ runner.os }}-conan.tgz

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: libsdlgame-${{ runner.os }}-conan
        path: libsdlgame-${{ runner.os }}-conan.tgz

  publish-release:
    needs: build-and-cache-conan
    runs-on: ubuntu-latest
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: conan_packages
        merge-multiple: true

    - name: Create GitHub Release with Conan Packages
      uses: softprops/action-gh-release@v2
      with:
        files: conan_packages/*.tgz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
